name: Capture Wedding Demos

on:
  workflow_dispatch:
  push:
    branches:
      - polish-live-studies-and-wedding-demo
    paths:
      - "scripts/capture-wedding-demos.mjs"
      - ".github/workflows/capture-wedding-demos.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: polish-live-studies-and-wedding-demo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture live demo
        run: node scripts/capture-wedding-demos.mjs

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-demos/wedding-home.png public/project-demos/wedding-rsvp.png
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture wedding demo screenshots [skip ci]"
          git push origin HEAD:polish-live-studies-and-wedding-demo
